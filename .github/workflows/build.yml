name: Build

# Checks on every push that the app and its tests compile on Windows (the release itself is built by hand with
# tools/release.ps1, which also needs OBS Studio, Inno Setup and vpk installed).
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build the app
        run: dotnet build src/Capture/Capture.csproj -c Release
      - name: Build the tests
        run: dotnet build tests/Capture.Tests/Capture.Tests.csproj -c Release
